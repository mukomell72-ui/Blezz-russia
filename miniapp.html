<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BLEZZ RUSSIA SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#090b10;--card:#121722;--card2:#171d29;--text:#f5f7fb;--muted:#8f9bad;
      --line:rgba(255,255,255,.08);--accent:#7c5cff;--accent2:#21d4fd;--good:#34d399;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:
        radial-gradient(circle at 15% -10%,rgba(124,92,255,.28),transparent 35%),
        radial-gradient(circle at 100% 10%,rgba(33,212,253,.13),transparent 28%),
        var(--bg);
    }
    .wrap{max-width:620px;margin:0 auto;padding:18px 14px 28px}
    .hero{
      padding:22px;border:1px solid var(--line);border-radius:24px;
      background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(18,23,34,.82));
      box-shadow:0 18px 50px rgba(0,0,0,.28)
    }
    .eyebrow{font-size:12px;color:#b9b2ff;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:7px 0 4px;font-size:28px;line-height:1.05}
    .sub{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
    .user{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:#ccd4df}
    .section-title{font-size:13px;color:var(--muted);margin:20px 4px 9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button,.tile{
      border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));
      color:var(--text);min-height:92px;padding:15px;text-align:left;cursor:pointer;
      transition:transform .12s ease,border-color .12s ease,background .12s ease;
      box-shadow:0 8px 26px rgba(0,0,0,.18)
    }
    button:active{transform:scale(.975)}
    .tile.full{grid-column:1/-1;min-height:74px;display:flex;align-items:center;gap:12px}
    .icon{font-size:25px;display:block;margin-bottom:10px}
    .full .icon{margin:0;font-size:26px}
    .name{font-size:15px;font-weight:800}
    .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
    .special{border-color:rgba(124,92,255,.35);background:linear-gradient(135deg,rgba(124,92,255,.18),var(--card))}
    .exclusive{border-color:rgba(33,212,253,.25)}
    .admin{border-color:rgba(52,211,153,.32);background:linear-gradient(135deg,rgba(52,211,153,.12),var(--card))}
    .footer{margin-top:20px;text-align:center;color:#6f7a8b;font-size:11px}
    @media(max-width:360px){.grid{grid-template-columns:1fr}.tile.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">BLEZZ RUSSIA</div>
      <h1>SHOP MENU</h1>
      <p class="sub">Быстрый доступ ко всему магазину прямо внутри Telegram.</p>
      <div class="user" id="user">Открыто в Telegram Mini App</div>
    </section>

    <div class="section-title">Магазин</div>
    <section class="grid">
      <button onclick="go('coins')"><span class="icon">💎</span><div class="name">Blezz Coins</div><div class="desc">Пакеты и своё количество BC</div></button>
      <button onclick="go('transport')"><span class="icon">🚗</span><div class="name">Транспорт</div><div class="desc">Машины и спецтранспорт</div></button>
      <button onclick="go('skins')"><span class="icon">👤</span><div class="name">Скины</div><div class="desc">Игровые образы</div></button>
      <button onclick="go('bundles')"><span class="icon">🎁</span><div class="name">Наборы</div><div class="desc">Комплекты товаров</div></button>
      <button class="tile full exclusive" onclick="go('exclusive')"><span class="icon">💠</span><div><div class="name">Эксклюзив</div><div class="desc">Ограниченные машины и скины с остатком</div></div></button>
    </section>

    <div class="section-title">Активности</div>
    <section class="grid">
      <button onclick="go('promos')"><span class="icon">🔥</span><div class="name">Акции</div><div class="desc">Товары со скидкой</div></button>
      <button onclick="go('giveaways')"><span class="icon">🎉</span><div class="name">Розыгрыши</div><div class="desc">Участие и призы</div></button>
      <button onclick="go('market')"><span class="icon">📣</span><div class="name">Объявления</div><div class="desc">Маркет игроков</div></button>
      <button onclick="go('rewards')"><span class="icon">🎮</span><div class="name">Бонусы</div><div class="desc">Баллы, рулетка и VIP</div></button>
    </section>

    <div class="section-title">Мой аккаунт</div>
    <section class="grid">
      <button onclick="go('cart')"><span class="icon">🛒</span><div class="name">Корзина</div><div class="desc">Текущие товары</div></button>
      <button onclick="go('orders')"><span class="icon">📦</span><div class="name">Мои заказы</div><div class="desc">Статусы и оплата</div></button>
      <button onclick="go('reviews')"><span class="icon">⭐</span><div class="name">Отзывы</div><div class="desc">Оставить или посмотреть</div></button>
      <button onclick="go('notifications')"><span class="icon">🔔</span><div class="name">Уведомления</div><div class="desc">Включить или отключить</div></button>
      <button class="tile full admin" onclick="go('admin')"><span class="icon">🛠</span><div><div class="name">Админ-панель</div><div class="desc">Откроется только владельцам</div></div></button>
      <button class="tile full special" onclick="support()"><span class="icon">💬</span><div><div class="name">Поддержка</div><div class="desc">@gromovnachile</div></div></button>
    </section>

    <div class="footer">BLEZZ RUSSIA SHOP · Telegram Mini App</div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe?.user;
      if (u) document.getElementById('user').textContent = 'Привет, ' + (u.first_name || u.username || 'игрок') + ' 👋';
    }

    function go(action){
      if (!tg) return;
      try {
        tg.HapticFeedback?.impactOccurred('light');
        tg.sendData(JSON.stringify({action}));
        setTimeout(()=>tg.close(),120);
      } catch (e) {}
    }

    function support(){
      if (tg?.openTelegramLink) tg.openTelegramLink('https://t.me/gromovnachile');
      else location.href='https://t.me/gromovnachile';
    }
  </script>
</body>
</html>
